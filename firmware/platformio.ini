[platformio]
default_envs = case-a-tft

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; SuperMini uses the C3's native USB for serial, not a UART bridge
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    h2zero/NimBLE-Arduino@^1.4.3

[env:case-a-tft]
build_flags =
    ${env.build_flags}
    -DCASE_DISPLAY_TFT
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

[env:case-b-matrix]
build_flags =
    ${env.build_flags}
    -DCASE_DISPLAY_MATRIX
lib_deps =
    ${env.lib_deps}
    fastled/FastLED@^3.7.0
